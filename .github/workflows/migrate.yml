# Migration gate. Runs goose up + status against an ephemeral Postgres.
#
# All database credentials come from GitHub Secrets — nothing sensitive
# lives in this file. Required secrets (repo Settings → Secrets → Actions):
#   CI_POSTGRES_USER, CI_POSTGRES_PASSWORD, CI_POSTGRES_DB
# Repos/forks without them skip the migration check with a notice.
# (Postgres is started via docker inside the gated step — not as a service —
# because service containers boot before any step can gate them, and the
# image refuses to start without a password.)
#
# GOOSE_VERSION must stay in sync with the Makefile.

name: Migrate Check

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GOOSE_VERSION: v3.28.0

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrate (goose, pinned)
        env:
          PGUSER: ${{ secrets.CI_POSTGRES_USER }}
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          PGDATABASE: ${{ secrets.CI_POSTGRES_DB }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "DB secrets not configured; skipping migration check."
            exit 0
          fi
          docker run -d --rm --name ci-postgres \
            -e POSTGRES_USER="$PGUSER" \
            -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -e POSTGRES_DB="$PGDATABASE" \
            -p 5432:5432 postgres:18-alpine
          trap "docker stop ci-postgres > /dev/null 2>&1 || true" EXIT
          for _ in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U "$PGUSER" > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
          DATABASE_URL="postgres://$PGUSER:$PGPASSWORD@localhost:5432/$PGDATABASE?sslmode=disable"
          $(go env GOPATH)/bin/goose -dir backend/migrations postgres "$DATABASE_URL" up
          $(go env GOPATH)/bin/goose -dir backend/migrations postgres "$DATABASE_URL" status
